name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'



      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Generate BPF code
        run: make generate

      - name: Run unit tests
        run: go test -v -race -count=1 ./test/unit/... ./internal/... ./cmd/... ./pkg/...

      - name: Build test
        run: go build ./...

      - name: Run acceptance checklist
        run: |
          go build -o netxfw ./cmd/netxfw
          ./scripts/release-checklist.sh ./netxfw

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
