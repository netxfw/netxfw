name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Generate BPF code
        run: make generate

      - name: Debug network interfaces
        run: |
          echo "=== Network interfaces ==="
          ip link show
          echo "=== Interface details ==="
          ls -la /sys/class/net/
          echo "=== Running as user ==="
          whoami
          echo "=== Kernel version ==="
          uname -a

      - name: Run unit tests
        run: go test -v -race -count=1 ./...

      - name: Build test
        run: go build ./...

      - name: Run acceptance checklist
        run: |
          go build -o netxfw ./cmd/netxfw
          ./scripts/release-checklist.sh ./netxfw

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
