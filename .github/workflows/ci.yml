name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read
  pull-requests: write

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run docs quality gates
        run: make docs-check

  generate-check:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Verify generated artifacts are up to date
        run: |
          make generate
          git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [generate-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run custom complexity checks
        run: |
          # These are specific overrides in Makefile that might be stricter than .golangci.yml
          go run github.com/fzipp/gocyclo/cmd/gocyclo@latest -over 15 ./internal/api/auth.go
          go run github.com/fzipp/gocyclo/cmd/gocyclo@latest -over 30 ./internal/api
          go run github.com/fzipp/gocyclo/cmd/gocyclo@latest -over 18 ./internal/datapath
          go run github.com/fzipp/gocyclo/cmd/gocyclo@latest -over 15 ./internal/plugins

  vet:
    name: Vet
    runs-on: ubuntu-latest
    needs: [generate-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [lint, vet]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Run tests with coverage
        run: |
          echo "Running tests and generating coverage..."
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test_output.txt
          go tool cover -func=coverage.out > coverage_report.txt
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 1 coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Detailed Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test & coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-results
          path: |
            test_output.txt
            coverage.out
            coverage_report.txt
          retention-days: 7

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: [test, docs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Run architectural and documentation checks
        run: |
          # Only run checks that aren't already covered by 'lint' or 'test' jobs
          bash ./scripts/check_markdown_links.sh
          bash ./scripts/check_cli_callgraphs.sh
          bash ./scripts/check_architecture.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -trimpath -o netxfw-linux-amd64 ./cmd/netxfw
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o netxfw-linux-arm64 ./cmd/netxfw
          upx --best netxfw-linux-amd64 netxfw-linux-arm64
          ls -lh netxfw-*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            netxfw-linux-amd64
            netxfw-linux-arm64
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [generate-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go and BPF toolchain
        uses: ./.github/actions/setup-go-bpf

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.22.9
        with:
          args: ./...
