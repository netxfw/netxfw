<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background: #fff;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      header {
        border-bottom: 1px solid #eaecef;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }
      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 2em;
        margin-top: 30px;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eaecef;
      }
      h3 {
        font-size: 1.5em;
        margin-top: 25px;
        margin-bottom: 10px;
      }
      a {
        color: #0366d6;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      ul, ol {
        margin-left: 30px;
        margin-bottom: 20px;
      }
      li {
        margin-bottom: 8px;
      }
      code {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 85%;
      }
      pre {
        background: #f6f8fa;
        padding: 16px;
        border-radius: 5px;
        overflow-x: auto;
        margin-bottom: 20px;
      }
      pre code {
        background: none;
        padding: 0;
      }
      blockquote {
        border-left: 4px solid #dfe2e5;
        padding-left: 16px;
        margin: 20px 0;
        color: #6a737d;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 20px 0;
      }
      th, td {
        border: 1px solid #dfe2e5;
        padding: 10px 15px;
        text-align: left;
      }
      th {
        background: #f6f8fa;
        font-weight: 600;
      }
      tr:nth-child(even) {
        background: #f6f8fa;
      }
      footer {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid #eaecef;
        color: #6a737d;
        font-size: 0.9em;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><a href="{{ site.baseurl | default: '/' }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </header>
      
      <main>
        {{ content }}
      </main>
      
      <footer>
        <p>Powered by <a href="https://pages.github.com" target="_blank">GitHub Pages</a></p>
      </footer>
    </div>
  </body>
</html>
